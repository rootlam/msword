name: Build WORD1

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S src -B out --preset x64-release -DCMAKE_C_FLAGS="/wd4013 /wd4091 /wd4101 /wd4201" -DCMAKE_CXX_FLAGS="/wd4013 /wd4091 /wd4101 /wd4201"

      - name: Build WORD1 Executable
        run: |
          cmake --build out --config Release --target WORD1 -j 1

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Word1-x64
          path: |
            out/bin/Release/WORD1.exe
            out/bin/WORD1.exe
            bin/WORD1.exe
            **/WORD1.exe
