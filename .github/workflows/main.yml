name: Build WORD1

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Stage CMake Helper Scripts
        run: |
          New-Item -ItemType Directory -Force -Path "src/cmake"
          Get-ChildItem -Path "src" -Recurse -Include "*.ps1","*.cmake" | Copy-Item -Destination "src/cmake/" -Force

      - name: Configure CMake
        run: |
          cmake -S src -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="/wd4013 /wd4091 /wd4101 /wd4201 /wd4716" -DCMAKE_CXX_FLAGS="/wd4013 /wd4091 /wd4101 /wd4201 /wd4716"

      - name: Build WORD1 Executable
        run: |
          cmake --build build --config Release --target WORD1 -j 1

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Word1-x64
          path: |
            build/bin/Release/WORD1.exe
            build/bin/WORD1.exe
            build/Release/WORD1.exe
            build/**/*.exe
