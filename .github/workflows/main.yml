name: Build WORD1

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        working-directory: src
        run: |
          cmake --preset x64-release -DCMAKE_C_FLAGS="/wd4013 /wd4091 /wd4101" -DCMAKE_CXX_FLAGS="/wd4013 /wd4091 /wd4101"

      - name: Build WORD1 Executable
        working-directory: src
        run: cmake --build --preset x64-release --target WORD1

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Word1-x64
          path: |
            **/WORD1.exe
            **/*.dll
